services:
  db:
    image: postgres:15-alpine
    container_name: hit_school_db
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: hitschool
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hit_school_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://root:rootpassword@db:5432/hitschool?schema=public
      - JWT_SECRET=supersecretjwtkey_change_in_production
    depends_on:
      - db
    # Usamos volumes para hot-reloading en entorno de desarrollo local
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hit_school_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend
    # Usamos volumes para hot-reloading
    volumes:
      - ./frontend:/app
      - /app/node_modules

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: hit_school_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Europe/Madrid
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  pgdata:
  db_data:
  n8n_data:
